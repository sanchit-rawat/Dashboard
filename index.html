<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

          <link rel="manifest" href="pwa-manifest.json">

    <title>Aesthetic Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>

    <!-- Ambient Glow -->
    <div class="ambient-bg"></div>
    <div class="cursor-glow"></div>

    <!-- MAIN DASHBOARD -->
    <div class="dashboard-container">

        <!-- TOP BAR -->
        <header class="top-bar">

            <button id="theme-toggle"
                    class="glass-btn">

                <i class="fas fa-moon"></i>

            </button>

        </header>

        <!-- HERO SECTION -->
        <main class="hero-section">

            <!-- CLOCK -->
            <div class="time-container glass-card">

                <h1 id="clock">
                    --:--
                </h1>

                <p id="date">
                    Loading date...
                </p>

            </div>

  <!-- SEARCH BAR -->

<div class="search-container">

    <i class="fas fa-search search-icon"></i>

    <input
        type="search"
        id="google-search"
        placeholder="676767"
        autocomplete="off"
        enterkeyhint="search">

</div>

        </main>

        <!-- WIDGET GRID -->
        <section class="widget-grid">

            <!-- WEATHER -->
            <div class="widget glass-card">

                <h3>
                    <i class="fas fa-cloud"></i>
                    Weather
                </h3>

                <div id="weather-info">

                    <p class="temp">
                        --°C
                    </p>

                    <p class="desc">
                        
                    </p>

                </div>

            </div>

            <!-- NOTES -->
            <div class="widget glass-card">

                <h3>
                    <i class="fas fa-pen"></i>
                    Quick Notes
                </h3>

                <textarea id="quick-notes"
                          placeholder="Write your thoughts..."></textarea>

            </div>

            <!-- TODO -->
            <div class="widget glass-card">

                <h3>
                    <i class="fas fa-check-circle"></i>
                    Tasks
                </h3>

                <div class="todo-input-group">

                    <input type="search"
                           id="todo-input"
                           placeholder="Add a task...">

                    <button id="add-todo">
                        <i class="fas fa-plus"></i>
                    </button>

                </div>

                <ul id="todo-list"></ul>

            </div>

            <!-- SPOTIFY -->
            <div class="widget glass-card">

                <h3>
                    <i class="fab fa-spotify"></i>
                    Chill Music
                </h3>

                <iframe
                    data-testid="embed-iframe"

                    style="border-radius:16px"

                    src="https://open.spotify.com/embed/playlist/33f6SkybskktunLAWRpSAe?utm_source=generator"

                    width="100%"

                    height="352"

                    frameBorder="0"

                    allowfullscreen=""

                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

                    loading="lazy">

                </iframe>

            </div>

        </section>

    </div>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
